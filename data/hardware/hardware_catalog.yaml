# 第二阶段硬件规格库（M14）
#
# 原则：
#  1. 数值**必须**有来源：本文件每条 spec 的 capacity/bandwidth 都引用抓取到的官方页面存档
#     （data/raw/official/，含 sha256）。厂商页面没写的字段一律留空并登记在
#     fields_pending_verification，不得用"常识"补齐。
#  2. **型号与 SKU 分离**：H100 SXM(80GB/HBM3/3.35TB/s) 与 H100 NVL(94GB/HBM3/3.9TB/s)
#     是两个 SKU，官方规格表里就是两列，绝不能互相顶替。
#  3. 标称容量 ≠ 推理可分配容量：`total_memory_bytes` 是厂商标称的归一化值；
#     `usable_memory_bytes` 必须来自实测（如 nvidia-smi），本轮为空并标记待测。
#  4. 单位：内部统一用 Bytes；展示时区分 GB(10^9) 与 GiB(2^30)，两者都显式标注。
#
# 采集日期：2026-10-15

schema_version: "1.0"
collected_at: "2026-10-15T16:20:00+08:00"

# ---------------------------------------------------------------------------
# 来源（官方页面存档）
# ---------------------------------------------------------------------------
sources:
  nvidia_h100_datasheet_page:
    vendor: nvidia
    url: https://www.nvidia.com/en-us/data-center/h100/
    file: data/raw/vendor/nvidia_h100_datacenter_2026-10-15.html
    sha256: aecc301719228f1068705d0ff37e79150d8988423891576e51c15dc94a4e6fe9
    retrieved_at: "2026-10-15T16:18:00+08:00"
    http_status: 200
    quote: >-
      "Product Specifications … H100 SXM | H100 NVL … GPU Memory 80GB | 94GB …
       GPU Memory Bandwidth 3.35TB/s | 3.9TB/s … Form Factor SXM | PCIe dual-slot air-cooled
       … Interconnect NVIDIA NVLink™: 900GB/s | NVIDIA NVLink: 600GB/s"
    verified_fields: ["total_memory_bytes", "memory_bandwidth_bytes_per_s", "interconnect"]
    notes: >-
      官方规格表把 H100 SXM 与 H100 NVL 并列；80GB/3.35TB/s 属 **SXM**，
      94GB/3.9TB/s 属 **NVL**。页面另提到 H100 NVL 双卡 NVLink 桥合起来 188GB HBM3。

  nvidia_h200_datasheet_page:
    vendor: nvidia
    url: https://www.nvidia.com/en-us/data-center/h200/
    file: data/raw/vendor/nvidia_h200_datacenter_2026-10-15.html
    sha256: 73a63384e31550c15ebfb94b45065f8b6cb9e0368644daafd27023227a28152f
    retrieved_at: "2026-10-15T16:18:00+08:00"
    http_status: 200
    quote: >-
      "the NVIDIA H200 is the first GPU to offer 141 gigabytes (GB) of HBM3e memory"
      "Specifications … H200 SXM | H200 NVL … GPU Memory 141GB | 141GB …
       GPU Memory Bandwidth 4.8TB/s | 4.8TB/s … Interconnect NVIDIA NVLink™: 900GB/s"
    verified_fields: ["total_memory_bytes", "memory_bandwidth_bytes_per_s", "hbm_type", "interconnect"]
    notes: "H200 SXM 与 H200 NVL 容量带宽相同，差异在形态/TDP；本轮只用 SXM。"

