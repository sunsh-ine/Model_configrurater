engine:
  backend: vllm
  backend_version: 0.24.0
  hardware: h200_sxm
  mode: aggregated
  model: Qwen/Qwen3-8B
  workers:
    aggregated:
      parallelism:
        pipeline: 1
        replicas: 2
        tensor: 1
traffic:
  load:
    requests_per_second: 5
    seed: 1
    type: poisson
  source:
    input_tokens: 8192
    output_tokens: 256
    type: synthetic
  stop:
    requests: 500
