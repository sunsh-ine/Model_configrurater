engine:
  backend: vllm
  backend_version: 0.24.0
  hardware: h100_sxm
  mode: aggregated
  model: Qwen/Qwen3-8B
  workers:
    aggregated:
      parallelism: {tensor: 1, pipeline: 1, replicas: 1}
traffic:
