# S1 最小场景：只有模型、候选硬件、目标负载与资源假设。
#
# 这条配置**只需要**这几项就能跑：性能、成本、报价等领域会因为缺输入
# 被标为"未配置/数据不足"，而不是报错 —— 这是刻意的设计。
#
#   python -m llm_capacity_pricing.cli plan --config data/examples/scenario_minimal.example.yaml \
#     --out data/exports/plan_minimal.md --json-out data/exports/plan_minimal.json --db data/local.db

request_id: minimal-scenario

model_id: qwen3-32b

hardware_ids:
  - nvidia-h100-sxm-80gb

server_id: hgx-h100-8gpu

workload:
  input_len: 8192
  output_len: 256
  concurrency: 32

# 资源假设：不填就只能是"信息不足"，不会自动补默认值
resources:
  usable_fraction: "0.9"
  usable_source_kind: synthetic_example
  runtime_reserve_fraction: "0.1"

advanced:
  tp_sizes: [2, 4, 8]
  dp_sizes: [1]
