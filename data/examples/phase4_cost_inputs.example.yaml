billing_rules:
  - rule_id: syn-billing-qwen3-32b
    model_name: qwen3-32b
    price_uncached_input_per_1m: "4"
    price_cached_input_per_1m: "1"
    price_output_per_1m: "12"
    billable_cache_ratio: "0.3"
    billable_cache_basis: assumed
    batch_discount_fraction: "0.5"
    min_billable_input_tokens_per_request: 128
    settlement_note: "合成示例：按自然月结算"
    status: synthetic_example
    origin: assumed
    notes: >-
      合成示例计费口径。billable_cache_ratio 是**计费口径**，必须声明依据；
      引擎的物理 prefix cache 命中率不得直接当作可计费缓存比例。
