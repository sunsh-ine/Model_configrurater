    origin: assumed

  - item_id: syn-power-energy
    category: power_energy
    name: "【合成示例】综合电价"
    price_basis: per_kwh
    unit_price: "0.8"
    unit: "currency_per_kwh"
    status: synthetic_example
    origin: assumed
    notes: "合成示例：数量由 GPU 功率 × 服务器附加功耗 × PUE × 负载率 × 小时推导"

  - item_id: syn-rack-space
