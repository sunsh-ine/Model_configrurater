  # ---- 缺数据示例：验证"未知不等于零"----------------------------------
  - item_id: syn-infiniband-fabric
    category: network
    name: "【合成示例】IB 组网（价格待确认）"
    price_basis: per_server_year
    unit_price: null
    unit: "currency_per_server_year"
