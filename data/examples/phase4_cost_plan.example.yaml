# 第四阶段（M28）部署成本方案模板 —— **合成示例**
#
# ⚠️ 全部数值来自 data/examples/phase4_cost_inputs.example.yaml 的**合成**成本目录。
#    这里只声明"买断/租赁口径 + 假设 + 选用哪些成本项"，卡数/服务器数由
#    第二阶段候选（DeploymentCandidate）在运行时绑定，避免把资源事实抄一遍。

schema_version: "1.0"
notice: >-
  合成示例方案模板。买断与租赁是**互斥**的两套模板：租赁模板不产生 capex，
  也不计折旧；买断模板不含租金。缺假设的项会被标为不可算，而不是按 0 处理。

# 成本范围覆盖策略（V4.1 F4.2）——**版本化**。
# 一个"完整 TCO"必须处理下列类别；方案既没选入、也没在 scope_exclusions 里
# 显式排除的类别，会被记为覆盖缺口，使 TCO 标为不完整。
# 换句话说：**不能靠"不选它"来规避完整性检查**。
coverage_policy:
  policy_id: syn-coverage-standard
  version: "1.0"
  # 授权状态（V4.2 E6）：这份策略是**示例草稿**，没有经过任何真实批准。
  # draft/unauthorized 的覆盖策略可以参与计算，但报价门禁一定会阻断 ——
  # 因为"哪些成本必须算"这件事本身必须可追溯到批准人，不能由示例或 Agent 自行决定。
  authority: draft
  notes:
    - "覆盖全部 10 类基础设施成本；任一类别必须 covered / excluded_by_scope / not_applicable"
    - "合成示例草稿策略，未获任何真实批准：不得支撑生产级完整 TCO 结论"
  requirements:
    - category: gpu_hardware
    - category: server_chassis
      # 租赁口径下不含整机采购，但模板必须显式排除并给出理由
      allow_scope_exclusion: true
    - category: network
    - category: storage
    - category: power_energy
    - category: facility_space
    - category: cooling
    - category: software_license
    - category: operations
    - category: maintenance

plan_templates:
  # ---- 买断（自有）-----------------------------------------------------
  - template_id: syn-owned-3y
    name: "【合成示例】买断自建，3 年周期"
    cost_basis: owned
    assumptions:
      horizon_years: 3
      depreciation_years: 3
      residual_value_fraction: "0.1"
      discount_rate_per_year: "0.08"
      escalation_rate_per_year: null
      pue: "1.3"
      pue_basis: assumed
      gpu_power_watts: "700"
      gpu_power_basis: assumed
      server_overhead_watts: "1500"
      it_power_utilization: "0.8"
    selections:
      - syn-gpu-purchase
      - syn-server-chassis
      - syn-network-port
      - syn-storage
      - syn-power-energy
      - syn-rack-space
      - syn-cooling
      - syn-software-license
      - syn-operations
      - syn-maintenance
    scope_notes:
      - "合成示例：假设 PUE 1.3、单卡功耗 700W（均为假定值，非厂商实测）"

  # ---- 租赁 ------------------------------------------------------------
  - template_id: syn-leased-3y
    name: "【合成示例】租赁，3 年周期"
    cost_basis: leased
    assumptions:
      horizon_years: 3
      depreciation_years: null
      residual_value_fraction: null
      discount_rate_per_year: "0.08"
      pue: "1.3"
      pue_basis: assumed
      gpu_power_watts: "700"
      gpu_power_basis: assumed
      server_overhead_watts: "1500"
      it_power_utilization: "0.8"
    selections:
      # 故意把"买断专属"的 GPU 采购价也列进来：引擎必须把它标成
      # excluded_by_cost_basis 并给出原因——用来验证"排除 ≠ 零成本"这条规则
      # 在真实链路上确实生效（而不是靠"没选它"来回避）。
      - syn-gpu-purchase
      - syn-gpu-lease
      - syn-network-port
      - syn-storage
      - syn-power-energy
      - syn-rack-space
      - syn-cooling
      - syn-software-license
      - syn-operations
      - syn-maintenance
    scope_exclusions:
      # 租赁口径由厂商提供整机，不自购机箱：必须**显式**排除并说明理由，
      # 否则会因"没选它"而被记为覆盖缺口
      - category: server_chassis
        reason: "合成示例：租赁含整机，不单独采购机箱"
    scope_notes:
      - "合成示例：租赁口径不含采购（syn-gpu-purchase 会被显式排除并记录原因）"
      - "合成示例：租赁口径不计折旧"

  # ---- 故意不完整：验证"未知不等于零"与报价阻断 ------------------------
  - template_id: syn-owned-incomplete
    name: "【合成示例】含待确认成本项（故意不完整）"
    cost_basis: owned
    assumptions:
      horizon_years: 3
      depreciation_years: 3
      residual_value_fraction: "0.1"
      discount_rate_per_year: "0.08"
      pue: "1.3"
      pue_basis: assumed
      gpu_power_watts: "700"
      gpu_power_basis: assumed
      server_overhead_watts: "1500"
      it_power_utilization: "0.8"
    selections:
      - syn-gpu-purchase
      - syn-server-chassis
      - syn-power-energy
      - syn-infiniband-fabric
    scope_exclusions:
      - category: storage
        reason: "合成示例：复用既有存储"
      - category: facility_space
        reason: "合成示例：机柜由现有机房提供"
      - category: cooling
        reason: "合成示例：制冷含在机柜费用内"
    scope_notes:
      - "含 unit_price 为空的成本项，用于验证 TCO incomplete 与报价阻断"
      - "另有若干类别既未选入也未排除（software_license / operations / maintenance），"
      - "用于验证覆盖缺口使 TCO 不完整"
