# 第四阶段（V4.1 F4.1）人工审批记录 —— **示例，不是真实审批**
#
# ⚠️ 本文件用于验证审批记录的**审计要求**：decision=approved 必须齐备审批人、
#    审批时间、有效期、凭据编号，并且作用域（候选 / 需求 / 方案）与
#    **成本快照指纹**必须与当前计算一致。这里全部是演示占位。
#
# 说明：
#   * cost_snapshot_hash 由方案的实际成本决定，写死之前无法预知；
