# Demo：公开数据驱动的部署方案评估 —— Qwen3-32B @ H100
#
# 这个 Demo 用**一份配置 + 一条命令**跑通：
#   需求 → 部署候选 → 公开实测参考 → SLA 可信度 → 成本估算 → 报告
#
# 数据来源分三层，报告里逐项标注，互不混淆：
#   1. 公开实测（measured_vendor_published）：SGLang 官方 Cookbook 的发布结果
#      （脚本 scripts/import_public_benchmarks.py 导入，来源逐个 sha256 校验）
#   2. 假设成本（synthetic_example）：示例成本目录，**不是真实报价**
#   3. 本仓库 fixture（synthetic_fixture）：仅用于验证算法，本 Demo 不使用
#
# 运行：
#   bash scripts/run_demo.sh

request_id: demo-qwen3-32b-h100

model_id: qwen3-32b

hardware_ids:
  - nvidia-h100-sxm-80gb

server_id: hgx-h100-8gpu

# 目标负载：8K 输入 / 256 输出 / 32 并发
workload:
  input_len: 8192
  output_len: 256
  concurrency: 32
  dataset: random
  arrival_mode: unbounded

# 资源假设（显式标注为假设，不是实测）
resources:
  usable_fraction: "0.9"
  usable_source_kind: synthetic_example
  runtime_reserve_fraction: "0.1"

# SLA 需求：你能不能接受这个时延？
sla:
  requirement_id: demo-sla-8k
  ttft_p99_ms_max: 400
  tpot_p99_ms_max: 30

# 成本：**假设**的成本目录（合成示例，明确标记，不是真实报价）
cost:
  plan_file: data/examples/phase4_cost_plan.example.yaml
  template_id: syn-owned-3y

budget:
  budget_id: demo-budget
  amount: "3000000"
  kind: total_horizon

advanced:
  tp_sizes: [2, 4, 8]
  dp_sizes: [1]
